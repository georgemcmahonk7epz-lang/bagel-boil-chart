version: 2.1

jobs:
  IS_HARD:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build artifact 10
          command: |
            mkdir -p /tmp/pipeline-05
            { set +o pipefail 2>/dev/null; sort </etc/shells >/tmp/filterViewWorker.dat && head -3 /tmp/filterViewWorker.dat; true ; } > /tmp/pipeline-05/draft_18a3ad8
            echo "gate min-ci: $(wc -c </tmp/pipeline-05/draft_18a3ad8) bytes total"
      - persist_to_workspace:
          root: /tmp/pipeline-05
          paths:
            - 'draft_18a3ad8'
  min-ci:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pipeline-05
      - run:
          name: Fetch upstream result
          command: |
            cat /tmp/pipeline-05/draft_18a3ad8
      - run:
          name: Pull code
          command: git clone --depth 3 --quiet --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Pull reference data
          command: tar --extract --xz -f files-stockpile.tar.xz
